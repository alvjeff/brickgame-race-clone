<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick Game Race - Big Jeff Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- Placar LCD -->
        <div class="score-board">
            <div class="score-line hi-line">HI <span id="highScoreDisplay">000000</span></div>
            <div class="score-line">SCORE <span id="scoreDisplay">000000</span></div>
        </div>

        <!-- Tela Principal do Jogo -->
        <div class="screen-wrapper">
            <canvas id="gameCanvas" width="200" height="400"></canvas>
            
            <!-- Tela de Boot / Carregamento -->
            <div id="loadingScreen" class="overlay-screen">
                <div class="brand-title">BIG JEFF GAMES</div>
                <div class="loading-bar-container">
                    <div id="loadingBar"></div>
                </div>
            </div>

            <!-- Tela de Menu Inicial (LCD estilo Game Boy / Nokia) -->
            <div id="startScreen" class="overlay-screen title-screen" style="display: none;">
                <div class="title-frame">
                    <div class="logo-brand">BIG JEFF GAMES</div>
                    <canvas id="titleLogo" width="160" height="90" aria-label="Brick Race"></canvas>
                    <div class="logo-tagline">LCD RACING</div>
                </div>

                <div class="press-start">APERTE START</div>

                <button id="startButton" class="start-btn" onclick="startGame()">JOGAR</button>
            </div>
        </div>

        <!-- Botões de Controle (Esquerda, Pause, Direita) -->
        <div class="controls-container">
            <button id="btnLeft" class="retro-btn">◀</button>
            <button id="btnPause" class="retro-btn pause-btn">PAUSE</button>
            <button id="btnRight" class="retro-btn">▶</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
